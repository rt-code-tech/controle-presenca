<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#111827">

  <title>Controle de Presença</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f3f4f6;
      color: #111827;

      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    #status {
      margin-top: 18px;
      padding: 16px;

      border-radius: 12px;

      text-align: center;

      font-size: 17px;
      font-weight: 600;

      background: #dbeafe;
      color: #1e40af;

      min-height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sucesso {
      background: #dcfce7 !important;
      color: #166534 !important;
    }

    .erro {
      background: #fee2e2 !important;
      color: #991b1b !important;
    }

    .info {
      background: #dbeafe !important;
      color: #1e40af !important;
    }

    .aviso {
      background: #fef3c7 !important;
      color: #92400e !important;
    }

    .instrucoes {
      background: white;
      border-radius: 12px;

      margin-top: 18px;
      padding: 16px;

      color: #4b5563;

      font-size: 14px;
      line-height: 1.5;
    }

    .instrucoes strong {
      color: #111827;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>📋 Controle de Presença</h1>

    <div class="subtitle">
      Aponte a câmera para o QR Code do aluno
    </div>

    <div id="reader"></div>

    <div
      id="status"
      class="info"
    >
      📷 Iniciando câmera...
    </div>

    <div class="instrucoes">

      <strong>Como usar:</strong>

      <br><br>

      Aponte a câmera para o QR Code do aluno.

      <br>

      A presença será registrada automaticamente.

    </div>

  </div>


<script>


// =====================================================
// URL DO GOOGLE APPS SCRIPT
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbww4kfK2H0m2RobNXVXrAJin3oOOxbY4Gpw8tqeUqq72E3BzQ4QayBH5dfc5lAPwPX7Uw/exec";


// =====================================================
// CONTROLE DE LEITURA
// =====================================================

let processando = false;


// =====================================================
// MOSTRAR STATUS
// =====================================================

function mostrarStatus(mensagem, tipo) {

  const status =
    document.getElementById("status");

  status.textContent = mensagem;

  status.className = "";

  status.classList.add(tipo);

}


// =====================================================
// REGISTRAR PRESENÇA
// =====================================================

function registrarPresenca(codigo) {

  // Impede qualquer nova leitura enquanto
  // estamos processando a anterior.

  if (processando) {
    return;
  }

  processando = true;


  mostrarStatus(
    "⏳ Registrando presença...",
    "info"
  );


  const url =
    API_URL +
    "?codigo=" +
    encodeURIComponent(codigo);


  fetch(url)

    .then(function(resposta) {

      if (!resposta.ok) {

        throw new Error(
          "Erro HTTP " +
          resposta.status
        );

      }

      return resposta.json();

    })

    .then(function(resultado) {


      // ============================================
      // PRESENÇA REGISTRADA
      // ============================================

      if (resultado.sucesso) {

        mostrarStatus(

          "✅ " +
          resultado.nome +
          " — presença registrada às " +
          resultado.hora,

          "sucesso"

        );

      }


      // ============================================
      // DUPLICADO
      // ============================================

      else if (resultado.duplicado) {

        mostrarStatus(

          "⚠️ " +
          resultado.nome +
          " já está presente hoje.",

          "aviso"

        );

      }


      // ============================================
      // OUTRO ERRO
      // ============================================

      else {

        mostrarStatus(

          "❌ " +
          resultado.mensagem,

          "erro"

        );

      }

    })

    .catch(function(erro) {

      console.error(erro);

      mostrarStatus(

        "❌ Erro ao conectar à planilha.",

        "erro"

      );

    });


  // =================================================
  // TRAVA DE SEGURANÇA
  //
  // Durante 5 segundos nenhuma outra leitura
  // será aceita.
  // =================================================

  setTimeout(function() {

    processando = false;

    mostrarStatus(

      "📷 Pronto para o próximo aluno.",

      "info"

    );

  }, 5000);

}


// =====================================================
// QR CODE DETECTADO
// =====================================================

function onScanSuccess(decodedText, decodedResult) {

  console.log(
    "QR detectado:",
    decodedText
  );


  registrarPresenca(decodedText);

}


// =====================================================
// FALHAS NORMAIS DE LEITURA
// =====================================================

function onScanFailure(error) {

  // Não fazemos nada.
  //
  // A câmera continua procurando QR Codes.

}


// =====================================================
// INICIAR SCANNER
// =====================================================

function iniciarScanner() {

  console.log("Iniciando scanner...");


  mostrarStatus(
    "📷 Iniciando câmera...",
    "info"
  );


  const scanner =
    new Html5QrcodeScanner(

      "reader",

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera: true

      },

      false

    );


  scanner.render(

    onScanSuccess,

    onScanFailure

  );

}


// =====================================================
// INICIALIZAÇÃO
// =====================================================

window.addEventListener(
  "load",
  iniciarScanner
);


</script>

</body>

</html>
